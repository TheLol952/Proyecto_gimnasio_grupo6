spring.application.name=gimnasio
server.port=${BACKEND_PORT:8081}

# --- Base de datos PostgreSQL (JDBC) ---
# Las variables se leen del ambiente o del .env raiz. El .env incluido contiene
# solo credenciales academicas de demostracion, nunca secretos reales.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gimnasio}
spring.datasource.username=${DB_USER:gimnasio_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Pool Tomcat JDBC ---
# Dimensionado para una aplicacion academica con carga pequena. El maximo de
# 15 limita conexiones a PostgreSQL y las 3 iniciales evitan latencia al
# comenzar la demostracion. Todos los tiempos se expresan en milisegundos,
# excepto remove-abandoned-timeout (segundos).
spring.datasource.tomcat.validation-query=SELECT 1
spring.datasource.tomcat.initial-size=3
spring.datasource.tomcat.min-idle=3
spring.datasource.tomcat.max-idle=8
spring.datasource.tomcat.max-active=15
spring.datasource.tomcat.max-wait=10000
spring.datasource.tomcat.test-on-borrow=true
spring.datasource.tomcat.test-on-return=false
spring.datasource.tomcat.test-while-idle=true
spring.datasource.tomcat.test-on-connect=true
spring.datasource.tomcat.time-between-eviction-runs-millis=30000
spring.datasource.tomcat.min-evictable-idle-time-millis=60000
spring.datasource.tomcat.remove-abandoned=true
spring.datasource.tomcat.remove-abandoned-timeout=60
spring.datasource.tomcat.validation-interval=30000

# Permite ejecutar desde backend/ o desde la raiz sin exportar variables.
# Un application-local.properties ignorado por Git sigue disponible para quien
# necesite sobrescribir la configuracion demostrativa en su propio equipo.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties],optional:file:./application-local.properties
