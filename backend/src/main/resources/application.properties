spring.application.name=gimnasio
server.port=8081

# --- Base de datos PostgreSQL (JDBC) ---
# La URL y el usuario tienen valores de desarrollo; la CLAVE nunca se escribe aqui.
# Definirla con la variable de entorno DB_PASSWORD o en backend/application-local.properties
# (ese archivo esta en .gitignore).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gimnasio}
spring.datasource.username=${DB_USER:gimnasio_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Archivo local opcional (no se sube a Git) para sobrescribir lo anterior.
spring.config.import=optional:file:./application-local.properties
