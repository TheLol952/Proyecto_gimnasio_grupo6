name: gimnasio-avance3

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/El_Salvador
      PGTZ: America/El_Salvador
    volumes:
      - gimnasio_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  seed:
    image: postgres:16-alpine
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database/data.sql:/demo/data.sql:ro
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -v
      - DEMO_ADMIN_USER=${DEMO_ADMIN_USER}
      - -v
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD}
      - -v
      - DEMO_RECEPTION_USER=${DEMO_RECEPTION_USER}
      - -v
      - DEMO_RECEPTION_PASSWORD=${DEMO_RECEPTION_PASSWORD}
      - -v
      - DEMO_TRAINER_USER=${DEMO_TRAINER_USER}
      - -v
      - DEMO_TRAINER_PASSWORD=${DEMO_TRAINER_PASSWORD}
      - -h
      - database
      - -U
      - ${DB_USER}
      - -d
      - ${DB_NAME}
      - -f
      - /demo/data.sql
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://database:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKEND_PORT: 8081
      TZ: America/El_Salvador
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_TARGET: http://backend:8081
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  gimnasio_postgres_data:
